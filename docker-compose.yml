services:
  app:
    build: .
    env_file: .env
    environment:
      - ADDR=0.0.0.0:8080
      - SQLITE_PATH=/app/data/banktoactual.db
      - UPLOAD_DIR=/app/uploads
      - ACTUAL_API_URL=http://actual-http-api:5007
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
    depends_on:
      - actual-http-api
    restart: unless-stopped

  actual-http-api:
    image: jhonderson/actual-http-api:latest
    env_file: .env
    restart: unless-stopped

volumes:
  db-data:
  uploads:
