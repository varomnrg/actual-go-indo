services:
  app:
    container_name: banktoactual
    build: .
    env_file: .env
    environment:
      - ADDR=0.0.0.0:8080
      - SQLITE_PATH=/app/data/banktoactual.db
      - UPLOAD_DIR=/app/uploads
      - ACTUAL_API_URL=http://actual-http-api:5007
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
    networks:
      - internal
      - proxy
    depends_on:
      - actual-http-api
    restart: unless-stopped

  actual-http-api:
    image: jhonderson/actual-http-api:latest
    env_file: .env
    networks:
      - internal
    restart: unless-stopped

volumes:
  db-data:
  uploads:

networks:
  internal:
  proxy:
    external: true
