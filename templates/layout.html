{{define "pageStart"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankToActual</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --accent:      #0d6efd;
            --accent-dark: #0b5ed7;
            --success:     #198754;
            --danger:      #dc3545;
            --surface:     #ffffff;
            --bg:          #f4f6f9;
            --border:      #dee2e6;
            --text:        #212529;
            --muted:       #6c757d;
            --radius:      8px;
            --shadow-sm:   0 1px 3px rgba(0,0,0,.08);
            --shadow-md:   0 4px 12px rgba(0,0,0,.08);
            --shadow-lg:   0 8px 24px rgba(0,0,0,.10);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .brand {
            font-weight: 700;
            color: var(--text);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: .5rem;
            letter-spacing: -0.01em;
        }
        nav .brand::before {
            content: "";
            display: block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
        }
        nav .nav-links { display: flex; gap: .25rem; }
        nav a {
            text-decoration: none;
            color: var(--muted);
            font-weight: 500;
            font-size: .9rem;
            padding: .4rem .75rem;
            border-radius: var(--radius);
            transition: all .15s ease;
        }
        nav a:hover { color: var(--text); background: var(--bg); }
        nav a.active { color: var(--accent); background: rgba(13,110,253,.06); }

        main { padding: 2rem 1.5rem; max-width: 1200px; margin: 0 auto; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .35rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            transition: all .15s ease;
            white-space: nowrap;
        }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-dark); box-shadow: 0 2px 8px rgba(13,110,253,.25); }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-secondary:hover { background: #5c636a; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #bb2d3b; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #157347; box-shadow: 0 2px 8px rgba(25,135,84,.25); }
        .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--bg); color: var(--text); }

        /* Amounts */
        .amount-credit { color: var(--success); font-weight: 600; font-variant-numeric: tabular-nums; }
        .amount-debit  { color: var(--danger); font-weight: 600; font-variant-numeric: tabular-nums; }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 1.5rem;
            transition: box-shadow .2s ease;
        }
        .card:hover { box-shadow: var(--shadow-md); }

        /* Tables */
        .table-wrapper { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .table { width: 100%; border-collapse: collapse; }
        .table thead tr { background: #f8f9fa; border-bottom: 2px solid var(--border); }
        .table th, .table td { padding: .65rem .75rem; text-align: left; }
        .table th { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
        .table tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
        .table tbody tr:last-child { border-bottom: none; }
        .table tbody tr:hover { background: #f8f9fa; }

        /* Badges */
        .badge { display: inline-flex; align-items: center; gap: .25rem; padding: .2rem .55rem; border-radius: 999px; font-size: .75rem; font-weight: 600; letter-spacing: .01em; }
        .badge-pending    { background: #fff3cd; color: #856404; }
        .badge-parsing    { background: #cce5ff; color: #004085; }
        .badge-done       { background: #d4edda; color: #155724; }
        .badge-error      { background: #f8d7da; color: #721c24; }
        .badge-duplicate  { background: #e2e3e5; color: #41464b; }
        .badge-reimport   { background: #f8d7da; color: #721c24; }

        /* Alerts */
        .alert { padding: .875rem 1rem; border-radius: var(--radius); margin-bottom: 1rem; border-left: 4px solid transparent; font-size: .9rem; display: flex; align-items: center; gap: .5rem; }
        .alert-success { background: #f0f9f4; color: #155724; border-left-color: var(--success); }
        .alert-danger  { background: #fdf2f2; color: #721c24; border-left-color: var(--danger); }
        .alert-warning { background: #fffbf0; color: #856404; border-left-color: #856404; }
        .alert::before { font-weight: 700; font-size: 1rem; }
        .alert-success::before { content: "✓"; color: var(--success); }
        .alert-danger::before  { content: "✕"; color: var(--danger); }
        .alert-warning::before { content: "⚠"; color: #856404; }

        /* Form */
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: .35rem; font-weight: 500; font-size: .9rem; }
        .form-control {
            width: 100%;
            padding: .55rem .65rem;
            border: 1px solid #ced4da;
            border-radius: var(--radius);
            font-size: .95rem;
            background: var(--surface);
            transition: border-color .15s, box-shadow .15s;
        }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,110,253,.12); outline: none; }
        .form-hint { font-size: .8rem; color: var(--muted); margin-top: .35rem; }
        .form-hint-error { color: var(--danger); }

        /* Page header */
        .page-header { margin-bottom: 1.5rem; }
        .page-header h1 { margin-bottom: .25rem; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
        .page-header p  { color: var(--muted); font-size: .9rem; }

        /* Empty state */
        .empty-state { color: var(--muted); padding: 3rem 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .75rem; font-size: .95rem; }
        .empty-state::before { content: "📭"; font-size: 2.5rem; opacity: .35; filter: grayscale(1); }

        /* File drop */
        .file-drop {
            display: block;
            position: relative;
            overflow: hidden;
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            color: var(--muted);
            transition: all .2s ease;
            background: var(--surface);
        }
        .file-drop:hover { border-color: var(--accent); color: var(--accent); background: rgba(13,110,253,.02); }
        .file-drop input[type=file] {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .file-drop .drop-icon { font-size: 1.75rem; margin-bottom: .5rem; opacity: .5; display: block; transition: opacity .2s; }
        .file-drop:hover .drop-icon { opacity: 1; }
        .file-drop .drop-text { font-size: .9rem; }
        .file-drop .drop-hint { font-size: .75rem; color: var(--muted); margin-top: .25rem; }

        /* Focused row (keyboard nav) */
        .focused-row { box-shadow: inset 4px 0 0 var(--accent); background: #f0f7ff !important; }

        /* Toggle pills */
        .toggle-group { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; }
        .toggle-group label {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            padding: .35rem .7rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: .8rem;
            cursor: pointer;
            transition: all .15s;
            user-select: none;
            color: var(--muted);
            font-weight: 500;
        }
        .toggle-group input { position: absolute; opacity: 0; width: 0; height: 0; }
        .toggle-group label:has(input:checked) { background: var(--accent); color: #fff; border-color: var(--accent); }
        .toggle-group label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
        .toggle-group label:hover:not(:has(input:checked)) { background: var(--bg); color: var(--text); }
        .toggle-divider { color: var(--border); font-size: .8rem; user-select: none; padding: 0 .15rem; }

        /* Stat chips */
        .stats-bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
        .stat-chip {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .3rem .65rem;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
            font-size: .8rem;
            color: var(--muted);
        }
        .stat-chip strong { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 700; }
        .stat-chip .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .stat-chip .dot-pending   { background: #856404; }
        .stat-chip .dot-approved  { background: var(--success); }
        .stat-chip .dot-skipped   { background: var(--muted); }
        .stat-chip .dot-duplicate { background: #adb5bd; }

        /* Section title */
        .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; padding-bottom: .5rem; border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: .5rem; letter-spacing: -0.01em; }

        /* Transaction rows */
        .tx-row { transition: background .15s; border-radius: calc(var(--radius) / 2); margin: 0 -0.25rem; padding: .6rem .75rem; }
        .tx-row:hover { background: #f8f9fa; }
        .tx-date { min-width: 5rem; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
        .tx-desc { flex: 1; min-width: 0; }
        .tx-desc-main { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .9rem; font-weight: 500; }
        .tx-desc-note { font-size: .75rem; color: var(--muted); margin-top: .1rem; }
        .tx-amount { min-width: 8rem; text-align: right; font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; }
        .tx-time { min-width: 2.5rem; font-size: .8rem; color: var(--muted); text-align: right; }
        .tx-actions { display: flex; gap: .35rem; align-items: center; }
        .tx-status { font-size: .8rem; font-weight: 500; }

        /* CTA button */
        .btn-cta { padding: .6rem 1.25rem; font-size: .9rem; font-weight: 600; }

        /* Responsive */
        @media (max-width: 768px) {
            main { padding: 1rem; }
            nav { padding: .6rem 1rem; }
            nav .brand { font-size: 1rem; }
            .card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <nav>
        <span class="brand">BankToActual</span>
        <div class="nav-links">
            <a href="/upload">Upload</a>
            <a href="/review">Review</a>
            <a href="/history">History</a>
            <a href="/settings">Settings</a>
        </div>
    </nav>
    <main>
    <script>
      document.querySelectorAll('nav a').forEach(a => {
        if (a.href === location.href || location.pathname.startsWith(new URL(a.href).pathname))
          a.classList.add('active');
      });
    </script>
{{end}}

{{define "pageEnd"}}
    </main>
</body>
</html>
{{end}}
